id: io.github.anicetuscer.imboard
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: imboard

add-extensions:
  io.github.anicetuscer.imboard.Model:
    directory: share/imboard/models
    version: "0.5"
    subdirectories: true
    no-autodownload: true
    autodelete: true

cleanup-commands:
  - mkdir -p "${FLATPAK_DEST}/share/imboard/models"

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: layer-shell-qt
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://invent.kde.org/plasma/layer-shell-qt.git
        commit: 76fbe5deb9d9545be98d1900b5d0df868616759e

  - name: spirv-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DSPIRV_HEADERS_SKIP_EXAMPLES=ON
      - -DSPIRV_HEADERS_SKIP_INSTALL=OFF
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        commit: 2a611a970fdbc41ac2e3e328802aed9985352dca

  - name: whisper-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DGGML_NATIVE=OFF
      - -DGGML_VULKAN=ON
      - -DWHISPER_BUILD_EXAMPLES=OFF
      - -DWHISPER_BUILD_SERVER=OFF
      - -DWHISPER_BUILD_TESTS=OFF
      - -DWHISPER_ALL_WARNINGS=OFF
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      - mkdir -p /app/bin
      - install -Dm644 LICENSE /app/share/licenses/imboard/whisper.cpp-LICENSE
    sources:
      - type: git
        url: https://github.com/ggml-org/whisper.cpp.git
        commit: f049fff95a089aa9969deb009cdd4892b3e74916

  - name: imboard
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_TESTING=OFF
      - -DIMBOARD_REQUIRE_WHISPER=ON
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - .git
          - build*
          - flatpak-build
          - flatpak-model-build
          - flatpak-repo
          - "*.flatpak"
