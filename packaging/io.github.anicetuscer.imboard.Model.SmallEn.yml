id: io.github.anicetuscer.imboard.Model.SmallEn
branch: "0.5"
runtime: io.github.anicetuscer.imboard
runtime-version: master
sdk: org.kde.Sdk//6.10
build-extension: true
separate-locales: false
appstream-compose: false

build-options:
  prefix: /app/share/imboard/models/SmallEn

modules:
  - name: whisper-small-en-model
    buildsystem: simple
    build-commands:
      - install -Dm644 ggml-small.en.bin "${FLATPAK_DEST}/ggml-small.en.bin"
      - install -Dm644 whisper-model-LICENSE "${FLATPAK_DEST}/share/licenses/imboard/whisper-model-LICENSE"
    sources:
      - type: file
        url: https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-small.en.bin
        sha256: c6138d6d58ecc8322097e0f987c32f1be8bb0a18532a3f88f734d1bbf9c41e5d
      - type: file
        path: whisper-model-LICENSE
